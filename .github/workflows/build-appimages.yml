name: Build and Release AppImages

on:
  push:
    tags:
      - "v*"

  # Allows testing the workflow manually without creating a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.build_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_name: aarch64
            runner: ubuntu-24.04-arm
            output_name: whack-a-hacker-aarch64

          - build_name: x86_64
            runner: ubuntu-24.04
            output_name: whack-a-hacker-x86_64

          - build_name: igel
            runner: ubuntu-22.04
            output_name: whack-a-hacker-igel

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate version tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid version tag: ${GITHUB_REF_NAME}"
            echo "Expected a tag such as v1.14 or v1.14.1"
            exit 1
          fi

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="v0.0-test"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION}"

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            python3 \
            python3-pygame \
            wget \
            file \
            desktop-file-utils \
            libfuse2 || true

          python3 --version
          python3 -c "import pygame; print('Pygame:', pygame.version.ver)"
          uname -m

      - name: Build AppImage
        shell: bash
        env:
          # Allows AppImage tools to run on GitHub runners without mounting FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x build-easy.sh
          ./build-easy.sh

      - name: Find and rename AppImage
        id: package
        shell: bash
        env:
          OUTPUT_NAME: ${{ matrix.output_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release

          BUILT_APPIMAGE="$(find AppImages -maxdepth 1 -type f \
            -name 'whack-a-hacker-*.AppImage' -print -quit)"

          if [[ -z "${BUILT_APPIMAGE}" ]]; then
            echo "No AppImage was created."
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          FINAL_NAME="${OUTPUT_NAME}_${VERSION}.AppImage"

          cp "${BUILT_APPIMAGE}" "release/${FINAL_NAME}"
          chmod +x "release/${FINAL_NAME}"

          echo "filename=${FINAL_NAME}" >> "$GITHUB_OUTPUT"

          echo "Created:"
          file "release/${FINAL_NAME}"
          ls -lh "release/${FINAL_NAME}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.output_name }}_${{ steps.version.outputs.version }}
          path: release/${{ steps.package.outputs.filename }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Create GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download all AppImages
        uses: actions/download-artifact@v5
        with:
          path: release
          pattern: whack-a-hacker-*
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          EXPECTED_FILES=(
            "release/whack-a-hacker-aarch64_${GITHUB_REF_NAME}.AppImage"
            "release/whack-a-hacker-x86_64_${GITHUB_REF_NAME}.AppImage"
            "release/whack-a-hacker-igel_${GITHUB_REF_NAME}.AppImage"
          )

          for appimage in "${EXPECTED_FILES[@]}"; do
            if [[ ! -f "${appimage}" ]]; then
              echo "Missing release file: ${appimage}"
              find release -maxdepth 2 -type f -print
              exit 1
            fi

            chmod +x "${appimage}"
            file "${appimage}"
          done

          sha256sum release/*.AppImage > release/SHA256SUMS.txt

          echo "Release contents:"
          ls -lh release

      - name: Create release and upload AppImages
        uses: softprops/action-gh-release@v3
        with:
          name: Whack-a-Hacker ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/whack-a-hacker-aarch64_${{ github.ref_name }}.AppImage
            release/whack-a-hacker-x86_64_${{ github.ref_name }}.AppImage
            release/whack-a-hacker-igel_${{ github.ref_name }}.AppImage
            release/SHA256SUMS.txt